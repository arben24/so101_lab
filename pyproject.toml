[project]
name = "so101-lab"
version = "0.1.0"
description = "Lehr-Repository für den SO-101-Roboterarm und die LeKiwi-Plattform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# LeRobot ist fest gepinnt: Importpfade und Registernamen ändern sich zwischen Versionen oft.
# torch kommt über die Gruppen "cpu"/"cuda" (siehe unten), weil [tool.uv.sources] nur auf
# direkte Abhängigkeiten wirkt.
dependencies = [
    "fastapi>=0.162.6",
    "lerobot[feetech,lekiwi,core-scripts]==0.7.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
so101-lab = "so101_lab.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.8",
]
docs = ["mkdocs-material>=9.5"]
sim = ["mujoco>=3"]
# torch-Variante für Linux x86_64. Standard ist "cpu" (ca. 1,2 GB). Für Training:
#   uv sync --no-group cpu --group cuda
cpu = ["torch", "torchvision"]
cuda = ["torch", "torchvision"]

[tool.uv]
default-groups = ["dev", "docs", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_lab"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]
extend-exclude = ["firmware"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
