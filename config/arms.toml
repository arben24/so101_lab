# Geräte für so101-lab. Ein [[device]]-Block je Arm oder Roboter.
# Wird ab Phase 2 vom Konfigurations-Lader gelesen; `so101-lab doctor` prüft schon jetzt,
# ob die Datei gültiges TOML ist.
#
# type:    so101_follower | so101_leader | lekiwi | lekiwi_arm | lekiwi_base
#          lekiwi = Arm und Basis (IDs 1–9), lekiwi_arm = nur Arm (1–6), lekiwi_base = nur
#          Basis (7–9). Alle drei teilen sich die Kalibrierdatei calibration/robots/lekiwi/.
# backend: usb | remote | esp32 | mock
#   usb     Arm hängt per USB am eigenen Rechner (port)
#   remote  Arm hängt an einem anderen Rechner, z. B. Raspberry Pi (address, token_env,
#           remote_device). Dort läuft `so101-lab web` mit derselben Gerätetabelle.
#   esp32   Arm hängt an einem ESP32-Funkknoten (address, Kapitel 07)
#   mock    simulierte Motoren, keine Hardware nötig
# port:    nur für usb. Darf fehlen: Dann wird der Port beim Start gewählt (Liste aus
#          `so101-lab ports`, später Auswahlliste in der Web-App). Feste Namen über
#          udev-Regeln sind bewusst noch nicht vorgesehen.
# calibration_id: Name der Kalibrierdatei (siehe calibration/ und LeRobot --robot.id)
# cameras: Liste von Kameras, z. B. [{ name = "front", source = "/dev/video0" }].
#          source: Gerätepfad (Linux am besten /dev/v4l/by-id/…), Nummer (Windows/macOS) oder "test".
#          Optional: width, height, fps (Standard 640, 480, 30), fourcc ("MJPG"), rotation (0/90/180/270).
#          Vorschlag für diesen Rechner: uv run so101-lab cameras
# safe_state: torque_off (Standard) oder hold – was beim Beenden/bei Fehlern passiert
# Bewegungsgrenzen (optional): max_velocity (Schritt/s, Standard 1000),
#   acceleration (×100 Schritt/s², Standard 20), max_relative_target (Schritt, Standard 400),
#   max_wheel_velocity (Schritt/s, Standard 3000)

[[device]]
name = "follower"
type = "so101_follower"
backend = "usb"
# port = "/dev/ttyACM0"        # Windows: "COM3", macOS: "/dev/cu.usbmodem..."
calibration_id = "follower_1"
# Webcam am Laborrechner (14.11.2026). Fehlt sie, verbindet der Arm trotzdem, mit Warnung.
cameras = [
  { name = "front", source = "/dev/v4l/by-id/usb-Generic_FULL_HD_1080P_Webcam_200901010001-video-index0" },
]

# [[device]]
# name = "leader"
# type = "so101_leader"
# backend = "usb"
# port = "/dev/ttyACM1"
# calibration_id = "leader_1"

# LeKiwi (Adapter SN 5AAF263183, 9 Servos), per USB am eigenen Rechner („kabelgebundene“
# LeKiwi). Drei Einträge für dieselbe Hardware: es kann immer nur einer verbunden sein.
[[device]]
name = "lekiwi"
type = "lekiwi"
backend = "usb"
calibration_id = "lekiwi_1"

[[device]]
name = "lekiwi_arm"
type = "lekiwi_arm"
backend = "usb"
calibration_id = "lekiwi_1"

[[device]]
name = "lekiwi_base"
type = "lekiwi_base"
backend = "usb"
calibration_id = "lekiwi_1"

# Derselbe LeKiwi über den Raspberry Pi (Kapitel 06). Auf dem Pi steht in dessen arms.toml
# ein usb-Gerät mit dem Namen aus remote_device, dort läuft `so101-lab web --host 0.0.0.0`.
# [[device]]
# name = "pi_lekiwi"
# type = "lekiwi"               # muss zum Gerät auf dem Pi passen (oder lekiwi_arm/lekiwi_base)
# backend = "remote"
# address = "raspberrypi.local:8000"
# remote_device = "lekiwi"      # Name auf dem Pi, Standard: derselbe Name wie hier
# token_env = "SO101_REMOTE_TOKEN"  # Umgebungsvariable mit dem Token des Pi (das ist der Standard)
# calibration_id = "lekiwi_1"

# LeKiwi über einen ESP32-Funkknoten (Kapitel 07). Profil des Knotens muss passen (hier lekiwi).
# Knoten suchen: uv run so101-lab esp32 suchen. Ohne Hardware: uv run so101-lab esp32 sim
[[device]]
name = "esp_kiwi"
type = "lekiwi"
backend = "esp32"
address = "lekiwi-test.local"  # Name oder IP, für die Simulation "127.0.0.1:4210"
calibration_id = "lekiwi_1"

[[device]]
name = "demo"
type = "so101_follower"
backend = "mock"
calibration_id = "mock"
cameras = [{ name = "sim", source = "test" }]  # Testbild, keine Hardware
