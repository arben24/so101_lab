; ESP32-Funkknoten für Feetech-Servos (LeKiwi, SO-101 und eigene Aufbauten)
;
; Zwei Programme in einem Projekt:
;   knoten   läuft auf dem ESP32 im Roboter (LeKiwi, später SO-101 und Leader)
;            und steuert die Feetech-Servos. Erreichbar über WLAN (UDP) und ESP-NOW.
;   gateway  läuft auf einem zweiten ESP32 am PC (USB) und übersetzt USB <-> ESP-NOW.
;            Nur nötig, wenn kein Router da ist oder als Rückfallebene.
;
; Hochladen:  pio run -e knoten -t upload
;             pio run -e gateway -t upload
; Monitor:    pio device monitor -e knoten
;
; Alles Weitere in README.md.

[platformio]
default_envs = knoten

[env]
platform = espressif32@6.12.0     ; Arduino-Core 2.0.17 (ESP-IDF 4.4)
board = esp32dev                  ; klassisches ESP32-DevKit (ESP32-WROOM-32)
framework = arduino
upload_speed = 921600
build_src_flags = -Wall

[env:knoten]
build_src_filter = +<knoten/>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DSERVO_RX_PIN=16             ; UART2 RX  <- Servo-Adapter
    -DSERVO_TX_PIN=17             ; UART2 TX  -> Servo-Adapter
    -DSTATUS_LED_PIN=2            ; blaue LED auf den meisten DevKits
    -DTASTER_PIN=0                ; BOOT-Taster: 3 s = Einrichtung, 10 s = Werkseinstellungen

[env:gateway]
build_src_filter = +<gateway/>
monitor_speed = 921600
build_flags =
    -DSTATUS_LED_PIN=2
