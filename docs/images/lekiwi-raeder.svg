<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" role="img" aria-labelledby="t d">
  <title id="t">LeKiwi-Basis von oben: Räder, Laufrichtungen, Koordinaten</title>
  <desc id="d">Draufsicht der LeKiwi-Basis, vorne ist oben. Drei Allseitenräder im Abstand R = 0,125 m von der Mitte: links vorne (ID 7, Laufrichtung 150 Grad), hinten (ID 8, minus 90 Grad), rechts vorne (ID 9, 30 Grad). Die Pfeile zeigen, wohin ein positiver Rohwert das Rad am Boden schiebt. x zeigt nach vorne, y nach links, die Drehung theta zählt gegen den Uhrzeigersinn.</desc>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #222; }
    .titel { font-size: 14px; font-weight: 700; }
    .zeile { font-size: 13px; }
    .klein { font-size: 12px; fill: #444; }
    .code { font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #333; }
    .koerper { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.5; }
    .rad { fill: #555; }
    .speiche { stroke: #bdbdbd; stroke-width: 1; stroke-dasharray: 4 4; }
    .lauf { stroke: #c0392b; stroke-width: 2.5; fill: none; }
    .achse { stroke: #3b6fd8; stroke-width: 2; fill: none; }
  </style>
  <rect x="1" y="1" width="828" height="468" fill="#fff" stroke="#e0e0e0"/>
  <text class="titel" x="20" y="28">LeKiwi-Basis von oben (vorne ist oben)</text>
  <circle class="koerper" cx="300" cy="230" r="148"/>
  <text class="klein" x="300" y="70" text-anchor="middle">vorne</text>
  <line class="achse" x1="300" y1="230" x2="300" y2="160" marker-end="url(#pb)"/>
  <text class="zeile" x="306" y="170" fill="#3b6fd8">x (W)</text>
  <line class="achse" x1="300" y1="230" x2="230" y2="230" marker-end="url(#pb)"/>
  <text class="zeile" x="230" y="222" fill="#3b6fd8">y (A)</text>
  <path class="achse" d="M334.0,230.0 A34,34 0 0 0 305.9,196.5" marker-end="url(#pb)"/>
  <text class="zeile" x="338" y="208" fill="#3b6fd8">θ (Z)</text>
  <line class="speiche" x1="300" y1="230" x2="196.1" y2="170.0"/>
  <rect class="rad" x="174.1" y="161.0" width="44" height="18" rx="4" transform="rotate(120.0 196.1 170.0)"/>
  <line class="lauf" x1="183.1" y1="192.5" x2="165.1" y2="223.7" marker-end="url(#pr)"/>
  <text class="zeile" x="135.5" y="135.0" text-anchor="end"><tspan font-weight="700">links</tspan> (ID 7)</text>
  <text class="code" x="135.5" y="151.0" text-anchor="end">a = 150°</text>
  <line class="speiche" x1="300" y1="230" x2="300.0" y2="350.0"/>
  <rect class="rad" x="278.0" y="341.0" width="44" height="18" rx="4" transform="rotate(-0.0 300.0 350.0)"/>
  <line class="lauf" x1="326.0" y1="350.0" x2="362.0" y2="350.0" marker-end="url(#pr)"/>
  <text class="zeile" x="300.0" y="426.0" text-anchor="middle"><tspan font-weight="700">hinten</tspan> (ID 8)</text>
  <text class="code" x="300.0" y="442.0" text-anchor="middle">a = -90°</text>
  <line class="speiche" x1="300" y1="230" x2="403.9" y2="170.0"/>
  <rect class="rad" x="381.9" y="161.0" width="44" height="18" rx="4" transform="rotate(-120.0 403.9 170.0)"/>
  <line class="lauf" x1="390.9" y1="147.5" x2="372.9" y2="116.3" marker-end="url(#pr)"/>
  <text class="zeile" x="464.5" y="135.0" text-anchor="start"><tspan font-weight="700">rechts</tspan> (ID 9)</text>
  <text class="code" x="464.5" y="151.0" text-anchor="start">a = 30°</text>
  <text class="titel" x="575" y="70">Legende</text>
  <line class="lauf" x1="575" y1="92" x2="609" y2="92" marker-end="url(#pr)"/>
  <text class="klein" x="619" y="96">positiver Rohwert:</text>
  <text class="klein" x="619" y="112">so schiebt das Rad</text>
  <text class="klein" x="619" y="128">die Basis (Laufrichtung a)</text>
  <line class="achse" x1="575" y1="152" x2="609" y2="152" marker-end="url(#pb)"/>
  <text class="klein" x="619" y="156">Koordinaten wie LeRobot,</text>
  <text class="klein" x="619" y="172">in Klammern die Taste</text>
  <text class="titel" x="575" y="214">Je Rad</text>
  <text class="code" x="575" y="238">v = cos(a)·x + sin(a)·y + R·θ</text>
  <text class="code" x="575" y="258">ω = v / r</text>
  <text class="code" x="575" y="278">roh = ω [°/s] · 4096/360</text>
  <text class="klein" x="575" y="306">R = 0,125 m (Mitte–Rad)</text>
  <text class="klein" x="575" y="322">r = 0,05 m (Radradius)</text>
  <text class="klein" x="575" y="350">Beispiel W (x = 0,1 m/s):</text>
  <text class="code" x="575" y="368">links −1129, hinten 0,</text>
  <text class="code" x="575" y="384">rechts +1129 Schritt/s</text>
  <text class="klein" x="575" y="412">Beispiel Z (θ = 30 °/s):</text>
  <text class="code" x="575" y="430">alle drei +853 Schritt/s</text>
</svg>
